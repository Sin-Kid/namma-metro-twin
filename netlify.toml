[build]
  command = "npm test && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # MAPBOX_TOKEN is a public (pk.) browser token and is meant to appear in the built page.
  # Exempt only that key from secrets scanning; everything else is still scanned.
  SECRETS_SCAN_OMIT_KEYS = "MAPBOX_TOKEN"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
